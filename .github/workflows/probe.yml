name: probe
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - run: |
          cd probe
          for v in orig fixed; do gcc -o $v.exe $v.c t.c; echo "== $v"; ./$v.exe; echo "exit=$?"; done
          gcc -O2 -o t2.exe orig.c t2.c; echo "== shipped call"; ./t2.exe; echo "exit=$?"; echo "== fixed call"; ./t2.exe fixed; echo "exit=$?"
